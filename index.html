<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de CEP e Pokédex</title>
</head>
<body>

    <h1>Buscador de CEP</h1>

    <form id="formularioCep">
        <input type="text" id="cep" placeholder="Digite o CEP">
        <button type="submit" id="botaoCep">Buscar CEP</button>
    </form>

    <p id="statusCep"></p>

    <dl id="resultadoCep"></dl>

    <h2>Histórico de CEPs</h2>

    <ul id="historico"></ul>

    <hr>

    <h1>Mini Pokédex</h1>

    <form id="formularioPokemon">
        <input type="text" id="pokemon" placeholder="Digite o nome do Pokémon">
        <button type="submit" id="botaoPokemon">Buscar Pokémon</button>
    </form>

    <p id="statusPokemon"></p>

    <div id="resultadoPokemon"></div>

    <script src="app.js"></script>
</body>
</html>
